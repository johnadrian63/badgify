<div class="grid h-screen grid-rows-[auto_minmax(0,1fr)]">
    <header
        class="flex items-center fixed bottom-0 w-full border-neutral-200 shadow-lg"
    >
        <router-outlet [name]="layoutBuilderSection.HEADER"></router-outlet>
    </header>
    <div
        [class.md:grid-cols-[0_minmax(0,1fr)_auto]]="false"
        [class.md:grid-cols-[250px_minmax(0,1fr)_auto]]="true"
        class="grid grid-cols-1 overflow-y-auto transition-[grid-template-columns] duration-300"
    >
        <aside
            [class.-translate-x-full]="false"
            [class.translate-x-0]="true"
            class="sidebar"
        >
            <router-outlet name="sidebar"></router-outlet>
        </aside>
        <main class="flex flex-col min-w-0 min-h-0 overflow-y-auto px-3">
            <div class="mb-2">
                <router-outlet></router-outlet>
            </div>
            <footer class="border border-neutral-100 shadow-2xl mt-auto p-3">
                <router-outlet
                    [name]="layoutBuilderSection.FOOTER"
                ></router-outlet>
            </footer>
        </main>
    </div>
</div>
