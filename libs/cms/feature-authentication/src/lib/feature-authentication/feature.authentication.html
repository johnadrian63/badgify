<div class="flex min-h-screen items-center justify-center bg-gray-100 p-4">
    <div class="w-full max-w-sm rounded-lg bg-white p-6 shadow">
        <h1 class="mb-2 text-center text-2xl font-bold">Badgify Login</h1>
        <p class="mb-6 text-center text-sm text-gray-500">Welcome back!</p>
        <form class="space-y-4">
            <input
                type="email"
                placeholder="Enter your email"
                class="w-full rounded-md border border-gray-300 p-3 outline-none focus:border-blue-500"
            />

            <input
                type="password"
                placeholder="Enter your password"
                class="w-full rounded-md border border-gray-300 p-3 outline-none focus:border-blue-500"
            />

            <button
                type="submit"
                class="w-full rounded-md bg-blue-600 p-3 text-white hover:bg-blue-700 cursor-pointer"
            >
                Sign in
            </button>
        </form>
    </div>
</div>
